<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSIG Loader — Circle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; background: #fff; overflow: hidden; }
    .webpage-background { position: fixed; inset: 0; background-image: url('../assets/MSIG-travel.png'); background-size: cover; background-position: top center; background-repeat: no-repeat; z-index: 0; }
    .loading-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, 0.9); z-index: 1; }
    .logo-frame { width: min(420px, 80vw); height: 280px; border: 0; background: transparent; color-scheme: light; transform: scale(0.7); transform-origin: center; }
  </style>
</head>
<body>
  <div class="webpage-background" aria-hidden="true"></div>
  <div class="loading-overlay">
    <iframe class="logo-frame" src="../logo-animations/MSIG-loader-circle.html" title="MSIG Loader — Circle" allowtransparency="true"></iframe>
  </div>
</body>
</html>
