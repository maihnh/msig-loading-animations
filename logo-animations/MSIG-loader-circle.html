<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Loader</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: sans-serif;
    }

    .loader-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      display: grid;
      place-items: center;
    }

    .loader-wrap::before,
    .loader-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    /* soft outer pulse */
    .loader-wrap::before {
      background: radial-gradient(circle, rgba(240, 0, 0, 0.10) 0%, rgba(240, 0, 0, 0.04) 35%, rgba(240, 0, 0, 0) 70%);
      transform: scale(0.88);
      animation: pulseGlow 1.8s ease-in-out infinite;
    }

    /* rotating trim ring */
    .loader-wrap::after {
      inset: 10px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #F00000;
      border-right-color: #0B004A;
      animation: spin 1.2s linear infinite;
    }

    .logo-box {
      position: relative;
      width: 84px;
      height: 92px;
      display: grid;
      place-items: center;
      animation: logoPulse 1.8s ease-in-out infinite;
      z-index: 1;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .base-dark {
      fill: #0B004A;
      opacity: 0.18;
    }

    .base-red {
      fill: #F00000;
      opacity: 0.14;
    }

    .draw-dark,
    .draw-red {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .draw-dark {
      stroke: #0B004A;
      stroke-width: 2.2;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: drawPath 2.2s ease-in-out infinite;
    }

    .draw-red {
      stroke: #F00000;
      stroke-width: 2.2;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: drawPath 2.2s ease-in-out infinite 0.18s;
    }

    .fill-dark {
      fill: #0B004A;
      opacity: 0;
      animation: fillIn 2.2s ease-in-out infinite;
    }

    .fill-red {
      fill: #F00000;
      opacity: 0;
      animation: fillIn 2.2s ease-in-out infinite 0.18s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.88);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(0.97);
      }
      50% {
        transform: scale(1.03);
      }
    }

    @keyframes drawPath {
      0% {
        stroke-dashoffset: 900;
        opacity: 0.25;
      }
      25% {
        opacity: 1;
      }
      55% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      80% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: -900;
        opacity: 0.2;
      }
    }

    @keyframes fillIn {
      0%, 20% {
        opacity: 0;
      }
      35%, 75% {
        opacity: 1;
      }
      100% {
        opacity: 0.15;
      }
    }
  </style>
</head>
