<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Loader</title>
  <style>
    :root {
      --purple: #BDB4FE;
      --purple-light: #D9D4FF;
      --purple-lighter: #EEEAFE;
      --purple-transparent: rgba(189, 180, 254, 0);
      --surface-90: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }
    .loader-stage {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    .loader-clipboard {
      position: relative;
      width: 100px;
      height: 130px;
      background: var(--surface-solid);
      border: 1px solid var(--purple-lighter);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(189, 180, 254, 0.22);
    }
    .loader-clipboard::before {
      content: '';
      position: absolute;
      width: 54px;
      height: 25px;
      left: 50%;
      top: 0;
      background-image:
        radial-gradient(ellipse at center, #0000 24%, var(--purple) 25%, var(--purple) 64%, #0000 65%),
        linear-gradient(to bottom, #0000 34%, var(--purple) 35%);
      background-size: 12px 12px, 100% auto;
      background-repeat: no-repeat;
      background-position: center top;
      transform: translate(-50%, -65%);
      box-shadow: 0 -3px rgba(189, 180, 254, 0.45) inset;
    }
    .loader-clipboard::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
      width: 66%;
      height: 60%;
      background: linear-gradient(to bottom, var(--purple-light) 30%, #0000 31%);
      background-size: 100% 16px;
      animation: writeDown 2s ease-out infinite;
    }
    @keyframes writeDown {
      0% { height: 0%; opacity: 0; }
      20% { height: 0%; opacity: 1; }
      80% { height: 65%; opacity: 1; }
      100% { height: 65%; opacity: 0; }
    }

  </style>
</head>
<body>
  <main class="loader-stage">
    <span class="loader-clipboard"></span>
  </main>
</body>
</html>
