<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsing Loader</title>
  <style>
    :root {
      --purple: #BDB4FE;
      --purple-light: #D9D4FF;
      --purple-lighter: #EEEAFE;
      --purple-transparent: rgba(189, 180, 254, 0);
      --surface-90: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--surface-90);
    }
    .loader-stage {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--surface-90);
    }

    .loader-pulse {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 6rem;
      height: 6rem;
    }
    .loader-pulse::before,
    .loader-pulse::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      animation: pulsOut 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 1rem rgba(189, 180, 254, 0.55));
    }
    .loader-pulse::before {
      width: 100%;
      padding-bottom: 100%;
      box-shadow: inset 0 0 0 1rem var(--purple);
      animation-name: pulsIn;
    }
    .loader-pulse::after {
      width: calc(100% - 2rem);
      padding-bottom: calc(100% - 2rem);
      box-shadow: 0 0 0 0 var(--purple);
    }
    @keyframes pulsIn {
      0% { box-shadow: inset 0 0 0 1rem var(--purple); opacity: 1; }
      50%, 100% { box-shadow: inset 0 0 0 0 var(--purple); opacity: 0; }
    }
    @keyframes pulsOut {
      0%, 50% { box-shadow: 0 0 0 0 var(--purple); opacity: 0; }
      100% { box-shadow: 0 0 0 1rem var(--purple); opacity: 1; }
    }

  </style>
</head>
<body>
  <main class="loader-stage">
    <span class="loader-pulse"></span>
  </main>
</body>
</html>
