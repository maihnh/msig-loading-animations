<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Loader</title>
  <style>
    :root {
      --purple: #BDB4FE;
      --purple-light: #D9D4FF;
      --purple-lighter: #EEEAFE;
      --purple-transparent: rgba(189, 180, 254, 0);
      --surface-90: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--surface-90);
    }
    .loader-stage {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--surface-90);
    }

    .loader-book {
      width: 200px;
      height: 140px;
      background: var(--purple-light);
      box-sizing: border-box;
      position: relative;
      border-radius: 10px;
      perspective: 1000px;
      box-shadow: 0 14px 34px rgba(189, 180, 254, 0.24);
    }
    .loader-book::before {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      bottom: 10px;
      border-radius: 8px;
      background: #fff no-repeat;
      background-size: 60px 10px;
      background-image:
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0);
      background-position: 15px 30px, 15px 60px, 15px 90px, 105px 30px, 105px 60px, 105px 90px;
      box-shadow: 0 0 10px rgba(189, 180, 254, 0.35);
    }
    .loader-book::after {
      content: '';
      position: absolute;
      width: calc(50% - 10px);
      right: 10px;
      top: 10px;
      bottom: 10px;
      border-radius: 8px;
      background: #fff no-repeat;
      background-size: 60px 10px;
      background-image:
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0),
        linear-gradient(var(--purple-lighter) 100px, transparent 0);
      background-position: 50% 30px, 50% 60px, 50% 90px;
      transform: rotateY(0deg);
      transform-origin: left center;
      animation: paging 1s linear infinite;
    }
    @keyframes paging {
      to { transform: rotateY(-180deg); }
    }

  </style>
</head>
<body>
  <main class="loader-stage">
    <span class="loader-book"></span>
  </main>
</body>
</html>
